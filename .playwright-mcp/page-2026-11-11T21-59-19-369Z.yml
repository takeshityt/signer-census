    - region "The Sweat sunset and what it could do to the volume" [ref=f10e290]:
      - heading "The Sweat sunset and what it could do to the volume" [level=2] [ref=f10e291]
      - blockquote [ref=f10e292]:
        - paragraph [ref=f10e293]: “Sweat Wallet and SWEAT in their present form will end on 30 December 2026.”
        - generic [ref=f10e294]:
          - text: "The Sweat Foundation Ltd (release of 2026-10-01). Date: 30 Dec 2026."
          - link "Source" [ref=f10e295] [cursor=pointer]:
            - /url: https://chainwire.org/2026/10/01/sweat-wallet-and-the-sweat-token-as-they-exist-today-end-on-30-december-2026/
      - paragraph [ref=f10e296]: ≈99.97% of FastAuth requests are relayed by sweat-relayer.near under the Sweat Foundation's login issuer, and FastAuth is ≈44% of all requests. Pick what happens to that traffic after 30 Dec 2026, whether the suspected benchmark keeps running, and how fast the rest (“structural” demand) grows. These are scenarios, not forecasts.
