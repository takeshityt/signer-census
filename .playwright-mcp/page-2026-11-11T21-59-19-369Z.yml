        - generic "Show as table" [ref=f10e361] [cursor=pointer]
    - region "The thesis" [ref=f10e362]:
      - heading "The thesis" [level=2] [ref=f10e363]
      - list [ref=f10e364]:
        - listitem [ref=f10e365]:
          - strong [ref=f10e366]: "Reliable:"
          - text: ≈6.4M signature requests since August 2024, ≈99.9% fulfilled.
        - listitem [ref=f10e367]:
          - strong [ref=f10e368]: "Narrow:"
          - text: the three largest requesters hold ≈74% of requests; only 7 ever reach a share of one percent.
        - listitem [ref=f10e369]:
          - strong [ref=f10e370]: "One integration drove the boom:"
          - code [ref=f10e371]: fast-auth.near
          - text: (FastAuth logins issued by the Sweat Foundation's domain) added ≈346k requests in April 2026; the Sweat Wallet product ends "in its present form" on 30 December 2026 (
          - link "source" [ref=f10e372] [cursor=pointer]:
            - /url: https://chainwire.org/2026/10/01/sweat-wallet-and-the-sweat-token-as-they-exist-today-end-on-30-december-2026/
          - text: ).
        - listitem [ref=f10e373]:
          - strong [ref=f10e374]: "Mostly NEAR itself:"
          - text: ≈46% of all signatures serve NEAR accounts; in October 2026 other chains lead (≈53% against ≈40%).
        - listitem [ref=f10e375]:
          - strong [ref=f10e376]: "Bridges are the structural signal:"
          - text: ≈237k of ≈267k structural requests in October 2026 come from the Omni, Bitcoin and Zcash connectors.
      - heading "What would prove us wrong" [level=3] [ref=f10e377]
      - paragraph [ref=f10e378]: Each test can be checked by re-running this repository after the stated date.
      - list [ref=f10e379]:
        - listitem [ref=f10e380]:
          - strong [ref=f10e381]: Narrow demand is wrong if
          - text: in each month from January 2027 to March 2027 at least 15 requesters hold a share of at least 1% (
          - code [ref=f10e382]: months[].concentration.requesters_ge_1pct
          - text: )
          - strong [ref=f10e383]: and
          - text: the three largest requesters hold less than 50% (
          - code [ref=f10e384]: months[].concentration.top3_share
          - text: "). Today: 7 and ≈78%."
        - listitem [ref=f10e385]:
          - strong [ref=f10e386]: "\"The boom was one integration being wound down\" is wrong if"
          - code [ref=f10e387]: fast-auth.near
          - text: requests in both February 2027 and March 2027 are at least 75% of its October 2026 level of ≈161k (
          - code [ref=f10e388]: months[].drivers_requests
          - text: ).
        - listitem [ref=f10e389]:
          - strong [ref=f10e390]: "\"Bridges are the durable signal\" is wrong if"
          - text: bridge requests (
          - code [ref=f10e391]: months[].series_requests_est.bridges
          - text: ) are below 100k in every month from January 2027 to March 2027 (today ≈237k), or if they fall below 50% of structural requests in each of those months.
        - listitem [ref=f10e392]:
          - strong [ref=f10e393]: "\"Cross-chain use is taking over\" is wrong if"
          - text: the other-chains share (
          - code [ref=f10e394]: months[].target_groups_share.other_chains
          - text: ) is below 40% in every month from January 2027 to March 2027 (today ≈53%).
        - listitem [ref=f10e395]:
          - strong [ref=f10e396]: "\"Production-grade\" is wrong if"
          - text: the fulfilled rate (
          - code [ref=f10e397]: months[].fulfilled_rate
          - text: ) is below 99% in any month from January 2027 to March 2027 (today ≈100.0%).
    - region "Re-run it yourself" [ref=f10e398]:
      - heading "Re-run it yourself" [level=2] [ref=f10e399]
      - paragraph [ref=f10e400]: "Needs Node and nothing else: no account, no API key, no paid service."
      - generic [ref=f10e401]:
        - generic [ref=f10e402]:
          - heading "npm test" [level=3] [ref=f10e403]
          - paragraph [ref=f10e404]: Unit tests for parsing, labels, estimates, THESIS.md numbers, scenarios and this page's data. Ends with the vitest summary and exit code 0.
        - generic [ref=f10e405]:
          - heading "npm run reproduce" [level=3] [ref=f10e406]
          - paragraph [ref=f10e407]: "Rebuilds out/metrics.json, out/scenarios.json and THESIS.md from the committed data, offline. It prints: out/metrics.json written. sha256 99d8c870b5f30456… (this page was built from that exact file)."
        - generic [ref=f10e408]:
          - heading "npm run verify -- --sample 50" [level=3] [ref=f10e409]
          - paragraph [ref=f10e410]: "Draws 50 random transactions with sign receipts and re-checks signer, block height and sign receipts at an archival RPC node and at NearBlocks. Last run: 50/50 verified (RPC 50/50, NearBlocks 50/50)."
        - generic [ref=f10e411]:
          - heading "npm run build:site && npm run site" [level=3] [ref=f10e412]
          - paragraph [ref=f10e413]: Copies the two JSON files into site/data/ with their sha256 and serves this page on http://127.0.0.1:4173/.
    - region "Honest notes" [ref=f10e414]:
      - heading "Honest notes" [level=2] [ref=f10e415]
      - generic [ref=f10e416]:
        - heading "Comparison with the existing dashboard" [level=3] [ref=f10e417]
        - paragraph [ref=f10e418]:
          - text: The Dune dashboard
          - code [ref=f10e419]: proximity_team/v1signer
          - text: shows 6,914,449 "total transactions" on 21 September 2026 (
          - link "source" [ref=f10e420] [cursor=pointer]:
            - /url: https://dune.com/proximity_team/v1signer
          - text: ). Its SQL is not visible and the values were read from the public page, not verified in Dune, so its unit is unknown. On the same date our exact count of all transactions touching
          - code [ref=f10e421]: v1.signer
          - text: (from the dashboard's start date) is 11,451,646 and their figure is 1.22 times our estimated request count; early in the series it matched our all-transaction count instead. No single unit of ours reproduces their series (docs/evidence/reconcile-proximity.md). They also publish a TVL metric that this census does not measure.
        - heading "What this census cannot measure" [level=3] [ref=f10e422]
        - list [ref=f10e423]:
          - listitem [ref=f10e424]: "The destination chain of each request from the Omni bridge and the Relay allocator (they sign for several chains; the chain is not in the sign arguments): reported as \"multi\"."
          - listitem [ref=f10e425]:
            - text: Whether
            - code [ref=f10e426]: tx-bench.near
            - text: is a benchmark; who operates it.
          - listitem [ref=f10e427]: "Value moved, fees paid or any revenue to NEAR or the NEAR token: the census counts signature requests only."
          - listitem [ref=f10e428]: "End users: one request is not one user, and FastAuth users cannot be counted from this data."
          - listitem [ref=f10e429]:
            - text: Other MPC signer contracts (for example
            - code [ref=f10e430]: v1.sig-net.near
            - text: ), testnet, and activity after the data snapshot.
          - listitem [ref=f10e431]: "Private source code (Dew kernels, Near-Bridge-Lab contracts): their path conventions are not decoded."
        - heading "Evidence against the thesis" [level=3] [ref=f10e432]
        - list [ref=f10e433]:
          - listitem [ref=f10e434]: The headline volume includes a suspected benchmark (≈19% of requests). It is labeled "unknown, suspected benchmark" because no source names it; if it is real usage, demand is less narrow than stated.
          - listitem [ref=f10e435]:
            - text: The Sweat link to FastAuth is strong on-chain (issuer domain, guard name, relayer) but no document says that Sweat Wallet logins go through
            - code [ref=f10e436]: fast-auth.near
            - text: ; and "ends in its present form" does not mean the traffic goes to zero.
          - listitem [ref=f10e437]: Bridges are only ≈1.2M of ≈6.4M requests over the whole period; one quarter of strong growth is not a trend.
          - listitem [ref=f10e438]: "Volume is not value: a bridge request can move large value and a login signature none; this census counts signatures, not value or fees."
          - listitem [ref=f10e439]: Most of the volume is recent (see the monthly series in out/metrics.json), so the history behind the trend is short and month-to-month swings are large.
        - heading "Read more" [level=3] [ref=f10e440]
        - paragraph [ref=f10e441]:
          - link "THESIS.md" [ref=f10e442] [cursor=pointer]:
            - /url: docs/THESIS.md
          - text: (full text, every number footnoted to its JSON path) ·
          - link "METHODOLOGY.md" [ref=f10e443] [cursor=pointer]:
            - /url: docs/METHODOLOGY.md
          - text: (definitions, sampling, limits).
