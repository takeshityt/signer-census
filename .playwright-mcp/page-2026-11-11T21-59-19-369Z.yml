    - 'region "Bridges: the structural signal" [ref=f10e346]':
      - 'heading "Bridges: the structural signal" [level=2] [ref=f10e347]'
      - paragraph [ref=f10e348]: The Omni, Bitcoin and Zcash connectors sign for bridge transfers. In Oct 2026 they made ≈237k requests, ≈89% of all structural requests (everything except the suspected benchmark and FastAuth). Over the whole period the three connectors made ≈1.2M requests.
