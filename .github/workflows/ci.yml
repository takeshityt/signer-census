# Offline checks on every push and pull request to main: tests, deterministic rebuild, data manifest, and "the rebuild changes nothing".
# No network-dependent steps (no `npm run verify`) and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run reproduce
      - run: npm run check:data
      - name: Fail if the rebuild changed any committed file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
